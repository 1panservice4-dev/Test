<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 풀페이스 가면 커스텀 드로잉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* 숨겨진 2D 캔버스 (텍스처로 사용) */
        #textureCanvas {
            display: none;
        }

        /* 툴바 스타일 */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tool-group label {
            font-size: 12px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
        }
        .tool-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
        }
        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #555;
        }
        button.active {
            background: #007acc;
            border-color: #0099ff;
        }
        input[type="range"] {
            width: 120px;
        }

        /* 가이드 안내문 */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <!-- Three.js 및 OrbitControls 라이브러리 불러오기 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="container"></div>

    <!-- 텍스처로 사용할 오프스크린 캔버스 -->
    <canvas id="textureCanvas" width="1024" height="1024"></canvas>

    <!-- 컨트롤 패널 -->
    <div class="toolbar">
        <div class="tool-group">
            <label>모드 선택</label>
            <div class="tool-row">
                <button id="modeRotate" class="active">시점 회전</button>
                <button id="modeDraw">그림 그리기</button>
            </div>
        </div>

        <div class="tool-group">
            <label>브러시 색상</label>
            <div class="tool-row">
                <input type="color" id="brushColor" value="#ff0055">
            </div>
        </div>

        <div class="tool-group">
            <label>브러시 크기 (<span id="sizeValue">20</span>px)</label>
            <div class="tool-row">
                <input type="range" id="brushSize" min="5" max="100" value="20">
            </div>
        </div>

        <div class="tool-group">
            <div class="tool-row">
                <button id="btnClear">전체 지우기</button>
            </div>
        </div>
    </div>

    <div class="instructions">
        💡 <b>시점 회전 모드:</b> 드래그하여 가면을 회전 / <b>그림 그리기 모드:</b> 가면 표면에 마우스/터치로 그리기
    </div>

    <script>
        // ----------------------------------------------------
        // 1. 2D 텍스처 캔버스 설정
        // ----------------------------------------------------
        const canvas2d = document.getElementById('textureCanvas');
        const ctx = canvas2d.getContext('2d');

        // 기본 가면 바탕색 설정 (흰색 마스크)
        function initCanvas() {
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);
            
            // 눈 구멍 부분 표시 (시각적 가이드)
            ctx.fillStyle = '#111111';
            ctx.beginPath();
            ctx.ellipse(350, 400, 60, 35, 0, 0, Math.PI * 2);
            ctx.ellipse(674, 400, 60, 35, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        initCanvas();

        // ----------------------------------------------------
        // 2. Three.js 3D 씬 설정
        // ----------------------------------------------------
        const container = document.getElementById('container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 조명 추가
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight1.position.set(5, 5, 5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        // OrbitControls (회전 조작)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ----------------------------------------------------
        // 3. 3D 풀페이스 가면 모델 생성 (파라메트릭 셰이프)
        // ----------------------------------------------------
        // 2D 캔버스를 Three.js 텍스처로 생성
        const canvasTexture = new THREE.CanvasTexture(canvas2d);
        canvasTexture.needsUpdate = true;

        // 마스크 절반 형태 곡선 생성
        const maskShape = new THREE.Shape();
        // 간단한 3D 두상/가면 형태 굴곡 생성 (구체를 이용)
        const maskGeometry = new THREE.SphereGeometry(1, 64, 64, 0, Math.PI); // 반구 형태
        maskGeometry.scale(0.85, 1.2, 0.6); // 얼굴 형태에 맞게 비율 조정 (가로, 세로, 두께)

        const maskMaterial = new THREE.MeshStandardMaterial({
            map: canvasTexture,
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
        });

        const maskMesh = new THREE.Mesh(maskGeometry, maskMaterial);
        maskMesh.rotation.y = -Math.PI / 2; // 정면을 바라보도록 회전
        scene.add(maskMesh);

        // Raycaster (마우스 클릭한 3D 위치를 2D 텍스처 좌표로 변환)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ----------------------------------------------------
        // 4. 이벤트 및 드로잉 로직
        // ----------------------------------------------------
        let isDrawingMode = false;
        let isMouseDown = false;
        let currentColor = '#ff0055';
        let currentSize = 20;

        // UI 요소
        const btnRotate = document.getElementById('modeRotate');
        const btnDraw = document.getElementById('modeDraw');
        const colorInput = document.getElementById('brushColor');
        const sizeInput = document.getElementById('brushSize');
        const sizeVal = document.getElementById('sizeValue');
        const btnClear = document.getElementById('btnClear');

        // 모드 변경
        btnRotate.addEventListener('click', () => {
            isDrawingMode = false;
            controls.enabled = true;
            btnRotate.classList.add('active');
            btnDraw.classList.remove('active');
        });

        btnDraw.addEventListener('click', () => {
            isDrawingMode = true;
            controls.enabled = false; // 드로잉 중에는 회전 비활성화
            btnDraw.classList.add('active');
            btnRotate.classList.remove('active');
        });

        colorInput.addEventListener('input', (e) => currentColor = e.target.value);
        sizeInput.addEventListener('input', (e) => {
            currentSize = e.target.value;
            sizeVal.innerText = currentSize;
        });

        btnClear.addEventListener('click', () => {
            initCanvas();
            canvasTexture.needsUpdate = true;
        });

        // 드로잉 기능 처리 (Raycasting)
        function drawOnMask(event) {
            if (!isDrawingMode || !isMouseDown) return;

            // 마우스/터치 위치 구하기
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;

            mouse.x = x;
            mouse.y = y;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(maskMesh);

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (hit.uv) {
                    // UV 좌표를 Canvas 2D 픽셀 좌표로 변환
                    const canvasX = hit.uv.x * canvas2d.width;
                    const canvasY = (1 - hit.uv.y) * canvas2d.height;

                    // 2D 캔버스에 그리기
                    ctx.fillStyle = currentColor;
                    ctx.beginPath();
                    ctx.arc(canvasX, canvasY, currentSize, 0, Math.PI * 2);
                    ctx.fill();

                    // 텍스처 갱신 알림
                    canvasTexture.needsUpdate = true;
                }
            }
        }

        // 마우스 및 터치 이벤트 연결
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            isMouseDown = true;
            drawOnMask(e);
        });

        window.addEventListener('mousemove', drawOnMask);

        window.addEventListener('mouseup', () => isMouseDown = false);

        // 모바일 터치 지원
        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            isMouseDown = true;
            if (e.touches.length > 0) drawOnMask(e.touches[0]);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) drawOnMask(e.touches[0]);
        });
        window.addEventListener('touchend', () => isMouseDown = false);

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----------------------------------------------------
        // 5. 애니메이션 루프
        // ----------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
