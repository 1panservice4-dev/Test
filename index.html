<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Animated Modular Character</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
    #ui { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 10px; }
    button { padding: 10px 16px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui">
    <button id="btnOutfitA">의상 A로 교체</button>
    <button id="btnOutfitB">의상 B로 교체</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Scene / Camera / Renderer 설정
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.4, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);

    // 조명
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(2, 4, 2);
    scene.add(dirLight);

    // 2. 애니메이션 및 변수 준비
    const loader = new GLTFLoader();
    const clock = new THREE.Clock(); // deltaTime 계산용
    
    let mixer = null;         // AnimationMixer
    let baseSkeleton = null;  // 공유할 캐릭터 메인 뼈대
    let currentOutfit = null; // 현재 착용 중인 의상 Mesh

    // 3. 애니메이션이 포함된 메인 캐릭터 바디 로드
    loader.load('character_body.glb', (gltf) => {
      const baseModel = gltf.scene;
      scene.add(baseModel);

      // 캐릭터 메인 뼈대(Skeleton) 찾기
      baseModel.traverse((node) => {
        if (node.isSkinnedMesh && !baseSkeleton) {
          baseSkeleton = node.skeleton;
        }
      });

      // 믹서 생성 및 첫 번째 애니메이션(예: Walk/Run) 바로 재생
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(baseModel);
        const action = mixer.clipAction(gltf.animations[0]);
        action.play(); // 애니메이션 지속 무한 재생
      }

      // 초기 의상 로드
      loadAndAttachOutfit('outfit_a.glb');
    });

    // 4. 의상 교체 함수 (애니메이션에 영향 없이 의상만 바인딩)
    function loadAndAttachOutfit(glbPath) {
      if (!baseSkeleton) return;

      loader.load(glbPath, (gltf) => {
        // 이전 의상이 있다면 메모리와 씬에서 정리
        if (currentOutfit) {
          scene.remove(currentOutfit);
        }

        const outfitScene = gltf.scene;

        // 의상 메시의 뼈대를 캐릭터의 baseSkeleton에 결합
        outfitScene.traverse((node) => {
          if (node.isSkinnedMesh) {
            node.bind(baseSkeleton, node.bindMatrix);
          }
        });

        currentOutfit = outfitScene;
        scene.add(currentOutfit);
      });
    }

    // 5. 버튼 이벤트
    document.getElementById('btnOutfitA').addEventListener('click', () => {
      loadAndAttachOutfit('outfit_a.glb');
    });

    document.getElementById('btnOutfitB').addEventListener('click', () => {
      loadAndAttachOutfit('outfit_b.glb');
    });

    // 6. 애니메이션 루프 (매 프레임마다 mixer.update 필수)
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta(); // 프레임 간 시간 차이
      if (mixer) {
        mixer.update(delta); // 뼈대를 애니메이션 위치로 갱신
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
